<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Emilia Glimt — hand-painted glass</title>
<meta name="description" content="Wine glasses and champagne flutes hand-painted by Emilia in Sweden. Black edges, gold leaf, no two alike. Shipped across Europe.">
<meta property="og:title" content="Emilia Glimt — hand-painted glass">
<meta property="og:description" content="Website mockup + brand playbook. Black edges, gold leaf, painted by Emilia.">
<meta property="og:image" content="og.png">
<meta name="theme-color" content="#F5F1EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141312'/%3E%3Cpath d='M9 20 L15 8 L23 13 L19 24 Z' fill='%23C9A24A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --natt:#141312;      /* black */
  --linne:#F5F1EA;     /* paper / background */
  --rok:#E8E1D5;       /* lines, cards */
  --sten:#8A847B;      /* muted text */
  --guld:#B8913A;      /* gold, solid */
  --guld-ljus:#E9D08A;
  --gold-grad:linear-gradient(115deg,#7A5A1C 0%,#C9A24A 28%,#F4E3A3 48%,#B8913A 68%,#8C6A23 100%);
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  --sig:"Mrs Saint Delafield",cursive;
  --r:14px;
  --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--linne);color:var(--natt);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
.serif{font-family:var(--serif)}
.sig{font-family:var(--sig);font-weight:400;line-height:1}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sten);font-weight:500}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1,h2,h3{font-family:var(--serif);font-weight:300;letter-spacing:-.01em;line-height:1.05}
h1{font-size:clamp(44px,6.2vw,84px)}
h2{font-size:clamp(34px,4.8vw,58px)}
h3{font-size:26px;font-weight:400}
h1 em,h2 em{font-style:italic}
.lead{font-size:17px;color:#3b3833;max-width:520px}
.muted{color:var(--sten)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 28px;border-radius:999px;font-weight:500;font-size:14px;letter-spacing:.02em;transition:transform .15s ease,background .2s,color .2s}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--natt);color:var(--linne)}
.btn-dark:hover{background:#2a2825}
.btn-gold{background:var(--gold-grad);background-size:160% 100%;color:var(--natt);transition:background-position .6s}
.btn-gold:hover{background-position:100% 0}
.btn-line{border:1px solid var(--natt)}
.btn-line:hover{background:var(--natt);color:var(--linne)}
.btn-block{width:100%}
.link{border-bottom:1px solid currentColor;padding-bottom:1px}

/* announcement + header */
.announce{background:var(--natt);color:var(--linne);font-size:12px;letter-spacing:.06em;text-align:center;padding:9px 16px}
.announce b{font-weight:500;color:var(--guld-ljus)}
header.site{position:sticky;top:0;z-index:40;background:rgba(245,241,234,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.site.scrolled{border-color:var(--rok)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:68px}
.nav-left,.nav-right{display:flex;gap:26px;align-items:center;font-size:13px;letter-spacing:.04em}
.nav-right{justify-content:flex-end}
.nav-left a:hover,.nav-right a:hover{opacity:.6}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo .sig{font-size:38px;transform:translateY(6px)}
.logo .mark{font-size:12px;letter-spacing:.42em;font-weight:500}
.cur{display:flex;border:1px solid var(--rok);border-radius:999px;padding:2px;font-size:11px}
.cur button{padding:3px 9px;border-radius:999px;letter-spacing:.06em}
.cur button.on{background:var(--natt);color:var(--linne)}
.cart-btn{position:relative;display:flex;align-items:center;gap:8px}
.cart-count{min-width:20px;height:20px;border-radius:99px;background:var(--natt);color:var(--linne);font-size:11px;display:grid;place-items:center;padding:0 6px}
.cart-count.zero{background:transparent;color:var(--natt);border:1px solid var(--natt)}
.menu-btn{display:none}
@media (max-width:820px){
  .nav{grid-template-columns:auto 1fr auto;height:60px}
  .nav-left .hide-m,.nav-right .hide-m{display:none}
  .menu-btn{display:block;padding:6px 4px}
  .logo{justify-self:center}
  .logo .sig{font-size:32px}
  .logo .mark{font-size:10px;letter-spacing:.34em}
  .nav-right{gap:12px}
}
.mobile-menu{position:fixed;inset:0;z-index:60;background:var(--linne);display:flex;flex-direction:column;padding:26px;transform:translateY(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mobile-menu.open{transform:none}
.mobile-menu nav{display:flex;flex-direction:column;gap:6px;margin-top:40px}
.mobile-menu nav a{font-family:var(--serif);font-size:44px;font-weight:300}
.mobile-menu .close{align-self:flex-end;font-size:13px;letter-spacing:.1em}

/* hero */
.hero{position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:30px;min-height:min(86vh,780px);padding-top:40px;padding-bottom:60px}
.hero h1{margin:18px 0 22px}
.hero h1 em{display:block}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:34px;font-size:12px;color:var(--sten);letter-spacing:.04em}
.trust span::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;transform:rotate(45deg) translateY(-1px);background:var(--gold-grad)}
.hero-art{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:0;height:100%}
.hero-art .g1{width:min(46%,260px);transform:translateX(14px) rotate(-3deg)}
.hero-art .g2{width:min(40%,224px);transform:translateX(-14px) rotate(4deg) translateY(-18px)}
.hero-art .disc{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0%,rgba(255,255,255,0) 68%);top:6%;left:11%}
.hero-art .note{position:absolute;right:0;top:14%;font-family:var(--sig);font-size:34px;transform:rotate(-8deg);color:var(--guld)}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;min-height:auto;padding-top:26px;padding-bottom:34px;gap:16px}
  .hero-art{order:-1;height:auto;max-height:360px}
  .hero-art .g1{width:44%}.hero-art .g2{width:38%}
  .hero-art .note{font-size:26px;right:4%}
  .hero h1{margin:12px 0 16px}
  .hero .ctas .btn{flex:1}
}
.flake-field{position:absolute;inset:0;pointer-events:none}
.flake-field i{position:absolute;display:block;background:var(--gold-grad);opacity:.85;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(var(--r0))}to{transform:translateY(-14px) rotate(calc(var(--r0) + 40deg))}}
@media (max-width:820px){.hero .flake-field{bottom:auto;height:330px}.dark .flake-field{bottom:auto;height:110px}}
@media (prefers-reduced-motion:reduce){.flake-field i,.marquee .track{animation:none!important}}

/* marquee */
.marquee{border-top:1px solid var(--rok);border-bottom:1px solid var(--rok);overflow:hidden;padding:15px 0;white-space:nowrap}
.marquee .track{display:inline-flex;gap:38px;animation:scroll 38s linear infinite;font-family:var(--serif);font-size:22px;font-style:italic;font-weight:300}
.marquee .track span:nth-child(even){font-style:normal;font-family:var(--sans);font-size:10px;letter-spacing:.3em;align-self:center;color:var(--guld)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* sections */
section{padding:110px 0}
@media (max-width:820px){section{padding:72px 0}}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:46px;flex-wrap:wrap}
.sec-head p{max-width:420px}

/* meet emilia */
.meet{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:center}
.portrait{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:
  radial-gradient(120% 80% at 30% 20%,#efe6d6 0%,#d9cdb8 55%,#b9ab93 100%)}
.portrait .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#4a443b;font-size:12px;letter-spacing:.04em}
.portrait .ph b{font-weight:500;font-size:13px}
.portrait .stamp{position:absolute;top:18px;right:18px;width:86px;height:86px;border-radius:50%;background:var(--natt);color:var(--linne);display:grid;place-items:center;text-align:center;font-size:9px;letter-spacing:.2em;line-height:1.5;transform:rotate(10deg)}
.portrait .stamp b{display:block;font-family:var(--sig);font-size:30px;letter-spacing:0;font-weight:400;color:var(--guld-ljus);line-height:.8;margin-bottom:4px}
.letter p{font-family:var(--serif);font-size:23px;line-height:1.45;font-weight:300;margin-bottom:18px;color:#24221f}
.letter .sig{font-size:64px;color:var(--natt);margin-top:6px}
.letter .hello{font-family:var(--sig);font-size:56px;color:var(--guld);line-height:1;margin-bottom:12px}
@media (max-width:820px){.meet{grid-template-columns:1fr;gap:34px}.letter p{font-size:20px}}

/* dark collection */
.dark{background:var(--natt);color:var(--linne);position:relative;overflow:hidden}
.dark .eyebrow{color:#a39c90}
.dark .lead{color:#cfc8bb}
.coll-title{display:flex;align-items:baseline;gap:18px}
.coll-title .no{font-family:var(--serif);font-size:20px;color:var(--guld-ljus);font-style:italic}
.coll-title h2{font-size:clamp(64px,11vw,150px);letter-spacing:.06em;font-weight:300}
.pron{font-size:13px;color:#a39c90;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{gap:12px}}
.card{display:block;position:relative}
.card .art{position:relative;aspect-ratio:4/5;border-radius:var(--r);background:#efe9df;display:flex;align-items:flex-end;justify-content:center;padding:14% 10% 8%;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.dark .card .art{background:#1f1d1b}
.dark .card .art::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 40%,rgba(255,240,205,.16),transparent 70%)}
.card:hover .art{transform:translateY(-4px)}
.card .art svg{max-height:100%;width:auto;position:relative;z-index:1}
.card .art .duo{display:flex;align-items:flex-end;height:100%;justify-content:center}
.card .art .duo svg{height:100%;width:auto}
.card .art .duo svg+svg{margin-left:-18%}
.card .meta{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px}
.card .meta .n{font-weight:500;letter-spacing:.06em}
.card .meta .t{color:var(--sten);font-size:13px}
.dark .card .meta .t{color:#a39c90}
.badge{position:absolute;top:12px;left:12px;z-index:2;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:var(--linne);color:var(--natt)}
.badge.gold{background:var(--gold-grad)}
.card .quick{position:absolute;right:12px;bottom:12px;z-index:2;width:42px;height:42px;border-radius:50%;background:var(--linne);color:var(--natt);display:grid;place-items:center;font-size:20px;opacity:0;transform:translateY(6px);transition:.25s}
.card:hover .quick{opacity:1;transform:none}
@media (hover:none){.card .quick{opacity:1;transform:none}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s}
.step{border-top:1px solid var(--natt);padding-top:20px}
.step .k{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--guld)}
.step h3{margin:6px 0 10px}
.step p{color:#55504a;font-size:14px}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr;gap:30px 18px}}

/* unique */
.unique{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.zoom{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#111;position:relative}
.zoom svg{width:100%;height:100%}
@media (max-width:820px){.unique{grid-template-columns:1fr;gap:30px}}

/* social */
.social-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;color:var(--linne);display:flex;flex-direction:column;justify-content:space-between;padding:12px;font-size:12px}
.tile .play{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:10px}
.tile b{font-weight:500;line-height:1.3;display:block;font-size:13px}
.tile small{opacity:.7;font-size:11px}
@media (max-width:1000px){.social-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.social-grid{grid-template-columns:repeat(2,1fr)}.social-grid .tile:nth-child(n+5){display:none}}

/* friends + join */
.friends{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:36px}
.friend{border:1px dashed #c9bfae;border-radius:var(--r);padding:26px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.friend .who{font-family:var(--serif);font-size:24px}
@media (max-width:820px){.friends{grid-template-columns:1fr}}
.join{text-align:center;max-width:640px;margin:0 auto}
.join form{display:flex;gap:10px;margin-top:28px;background:#fff;padding:6px;border-radius:999px;border:1px solid var(--rok)}
.join input{flex:1;border:0;outline:0;background:transparent;padding:0 18px;min-width:0}
.join .fine{font-size:12px;margin-top:14px}

/* footer */
footer{background:var(--natt);color:#cfc8bb;padding:80px 0 40px;font-size:13px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
footer h4{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8d867b;font-weight:500;margin-bottom:16px}
footer li{list-style:none;margin-bottom:9px}
footer a:hover{color:var(--linne)}
footer .logo{color:var(--linne)}
footer .logo .sig{font-size:50px}
.foot-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid #2c2a27;margin-top:60px;padding-top:24px;font-size:12px;color:#8d867b}
.pay-icons{display:flex;gap:6px;flex-wrap:wrap}
.pay-icons span{border:1px solid #3a3733;border-radius:5px;padding:3px 7px;font-size:10px;letter-spacing:.06em}
@media (max-width:820px){.foot{grid-template-columns:1fr 1fr}.foot>div:first-child{grid-column:1/-1}}

/* product page */
.crumbs{font-size:12px;color:var(--sten);padding:22px 0;letter-spacing:.04em}
.crumbs a:hover{color:var(--natt)}
.pdp{display:grid;grid-template-columns:1.15fr 1fr;gap:60px;padding-bottom:90px}
.gallery{display:grid;grid-template-columns:80px 1fr;gap:14px;position:sticky;top:90px;align-self:start}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumbs button{aspect-ratio:4/5;border-radius:10px;background:#efe9df;padding:8px;border:1px solid transparent;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.thumbs button.on{border-color:var(--natt)}
.thumbs button svg{max-height:100%;width:auto}
.stage{aspect-ratio:4/5;border-radius:var(--r);background:#efe9df;display:flex;align-items:flex-end;justify-content:center;padding:10% 12% 6%;position:relative;overflow:hidden}
.stage.dark-bg{background:#1b1a18}
.stage svg{max-height:100%;width:auto}
.stage .duo{display:flex;align-items:flex-end;height:100%}
.stage .duo svg{height:100%;width:auto}.stage .duo svg+svg{margin-left:-16%}
.stage .cap{position:absolute;left:16px;bottom:14px;font-size:11px;letter-spacing:.06em;color:var(--sten)}
.buy h1{font-size:clamp(44px,5vw,68px);letter-spacing:.04em}
.buy .type{font-family:var(--serif);font-style:italic;font-size:22px;color:#4b463f;margin-top:4px}
.buy .price{font-size:20px;margin:22px 0 4px;font-weight:500}
.buy .price small{font-size:12px;color:var(--sten);font-weight:400;margin-left:6px}
.stock{display:flex;align-items:center;gap:10px;font-size:13px;margin:16px 0 26px}
.stock .bar{flex:0 0 120px;height:3px;background:var(--rok);border-radius:3px;overflow:hidden}
.stock .bar i{display:block;height:100%;background:var(--gold-grad)}
.opt-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sten);margin-bottom:10px;display:flex;justify-content:space-between}
.swatches{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:10px;border:1px solid var(--rok);border-radius:999px;padding:8px 16px 8px 8px;font-size:13px;background:#fff}
.swatch .dot{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.swatch.on{border-color:var(--natt);box-shadow:inset 0 0 0 1px var(--natt)}
.buy-row{display:flex;gap:10px}
.qty{display:flex;align-items:center;border:1px solid var(--rok);border-radius:999px;background:#fff;height:52px}
.qty button{width:42px;height:100%;font-size:18px}
.qty span{min-width:22px;text-align:center}
.buy-row .btn{flex:1}
.promise{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 28px}
.promise div{background:#efe9df;border-radius:12px;padding:14px;font-size:12.5px;line-height:1.45}
.promise b{display:block;font-weight:500;margin-bottom:2px}
.maker-note{display:flex;gap:14px;align-items:center;border-top:1px solid var(--rok);border-bottom:1px solid var(--rok);padding:18px 0;margin:6px 0 6px}
.maker-note .av{flex:0 0 52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe6d6,#b9ab93);display:grid;place-items:center;font-family:var(--sig);font-size:30px;color:var(--natt)}
.maker-note p{font-family:var(--serif);font-size:18px;line-height:1.35;font-style:italic}
details.acc{border-bottom:1px solid var(--rok)}
details.acc summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:500;letter-spacing:.02em}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-weight:300;font-size:20px;line-height:1}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 0 20px;color:#4b463f;font-size:14px}
details.acc .body p+p{margin-top:10px}
.sticky-buy{display:none}
@media (max-width:900px){
  .pdp{grid-template-columns:1fr;gap:26px}
  .gallery{position:static;grid-template-columns:1fr}
  .thumbs{flex-direction:row;order:2}
  .thumbs button{width:70px}
  .sticky-buy{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;gap:12px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(245,241,234,.94);backdrop-filter:blur(12px);border-top:1px solid var(--rok);transform:translateY(110%);transition:transform .3s}
  .sticky-buy.show{transform:none}
  .sticky-buy .btn{flex:1;height:48px}
  .sticky-buy .p{font-size:13px;line-height:1.3}
}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(20,19,18,.4);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--linne);z-index:80;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--rok)}
.drawer header h3{font-size:30px}
.drawer .items{flex:1;overflow:auto;padding:8px 24px}
.ship-meter{padding:16px 24px;border-bottom:1px solid var(--rok);font-size:13px}
.ship-meter .bar{height:3px;background:var(--rok);border-radius:3px;margin-top:10px;overflow:hidden}
.ship-meter .bar i{display:block;height:100%;background:var(--gold-grad);transition:width .4s}
.line{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:18px 0;border-bottom:1px solid var(--rok)}
.line .th{aspect-ratio:4/5;border-radius:10px;background:#efe9df;display:flex;align-items:flex-end;justify-content:center;padding:6px;overflow:hidden}
.line .th svg{max-height:100%;width:auto}
.line .th .duo{display:flex;align-items:flex-end;height:100%}.line .th .duo svg{height:100%;width:auto}.line .th .duo svg+svg{margin-left:-16%}
.line .nm{font-weight:500;letter-spacing:.04em;font-size:14px}
.line .vr{color:var(--sten);font-size:12px}
.line .mini-qty{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--rok);border-radius:99px;padding:2px 10px;margin-top:10px;font-size:13px;background:#fff}
.line .rm{font-size:11px;color:var(--sten);text-decoration:underline;margin-left:10px}
.line .pr{font-size:14px;text-align:right}
.drawer footer{background:none;color:inherit;padding:20px 24px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--rok)}
.drawer .tot{display:flex;justify-content:space-between;font-size:16px;margin-bottom:6px}
.drawer .hand{font-family:var(--serif);font-style:italic;font-size:16px;color:#4b463f;margin-bottom:14px}
.empty{text-align:center;padding:60px 10px}
.empty .sig{font-size:48px;color:var(--guld)}

/* checkout */
.co-head{display:flex;justify-content:space-between;align-items:center;height:72px;border-bottom:1px solid var(--rok)}
.co{display:grid;grid-template-columns:1.2fr 1fr;min-height:calc(100vh - 72px)}
.co-main{padding:40px 56px 80px max(22px,calc((100vw - var(--max))/2 + 22px))}
.co-side{background:#EDE7DC;border-left:1px solid var(--rok);padding:40px max(22px,calc((100vw - var(--max))/2 + 22px)) 40px 48px}
.co-side .inner{position:sticky;top:30px}
.co h2{font-size:34px;margin:34px 0 16px}
.co h2:first-child{margin-top:0}
.express{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.express button{height:48px;border-radius:10px;font-weight:600;font-size:14px}
.x-apple{background:#000;color:#fff}.x-google{background:#fff;border:1px solid #ddd!important}.x-klarna{background:#FFB3C7;color:#0b051d}
.or{display:flex;align-items:center;gap:14px;color:var(--sten);font-size:12px;margin:26px 0 4px;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rok)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.f{position:relative}
.f input,.f select,.f textarea{width:100%;height:52px;border:1px solid #d8d0c3;border-radius:10px;background:#fff;padding:18px 14px 4px;outline:0;transition:border-color .2s}
.f textarea{height:96px;padding-top:24px;resize:vertical}
.f label{position:absolute;left:15px;top:6px;font-size:10.5px;color:var(--sten);letter-spacing:.04em}
.f input:focus,.f select,.f textarea:focus{border-color:var(--natt)}
.f.err input{border-color:#b3412e}
.radio-list{border:1px solid #d8d0c3;border-radius:10px;background:#fff;overflow:hidden}
.radio-list label{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--rok);cursor:pointer;font-size:14px}
.radio-list label:last-child{border-bottom:0}
.radio-list input{accent-color:var(--natt);width:18px;height:18px}
.radio-list .grow{flex:1}
.radio-list small{display:block;color:var(--sten);font-size:12px}
.radio-list label.on{background:#faf8f4}
.pay-panel{padding:16px;background:#faf8f4;border-bottom:1px solid var(--rok);font-size:13px;color:var(--sten)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:14px 0;cursor:pointer}
.check input{accent-color:var(--natt);width:18px;height:18px;margin-top:2px}
.gift{background:#fff;border:1px solid #d8d0c3;border-radius:10px;padding:16px}
.gift .sig{font-size:30px;color:var(--guld)}
.sum-line{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;margin-bottom:16px}
.sum-line .th{position:relative;aspect-ratio:4/5;border-radius:10px;background:#e3dbcd;display:flex;align-items:flex-end;justify-content:center;padding:5px}
.sum-line .th svg{max-height:100%;width:auto}
.sum-line .th .duo{display:flex;align-items:flex-end;height:100%}.sum-line .th .duo svg{height:100%;width:auto}.sum-line .th .duo svg+svg{margin-left:-16%}
.sum-line .q{position:absolute;top:-7px;right:-7px;background:var(--sten);color:#fff;font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.sum-row{display:flex;justify-content:space-between;font-size:14px;margin:8px 0}
.sum-row.total{font-size:20px;font-weight:500;border-top:1px solid #d6cdbd;padding-top:16px;margin-top:16px}
.sum-row.total small{font-size:12px;color:var(--sten);font-weight:400;margin-right:6px}
.demo{font-size:12px;color:var(--sten);margin-top:12px;text-align:center}
.mob-sum{display:none}
@media (max-width:900px){
  .co{grid-template-columns:1fr}
  .co-side{display:none}
  .co-main{padding:22px 18px 60px}
  .mob-sum{display:block;background:#EDE7DC;border-bottom:1px solid var(--rok)}
  .mob-sum summary{list-style:none;padding:16px 18px;display:flex;justify-content:space-between;font-size:14px;cursor:pointer}
  .mob-sum summary::-webkit-details-marker{display:none}
  .mob-sum .inner{padding:4px 18px 18px}
  .express{grid-template-columns:1fr}
}

/* thanks + about */
.thanks{max-width:720px;margin:0 auto;text-align:center;padding:70px 22px 100px}
.thanks .sig{font-size:clamp(64px,10vw,110px);color:var(--guld);margin-bottom:6px}
.paper{background:#fff;border-radius:6px;padding:40px 36px;text-align:left;box-shadow:0 30px 60px -30px rgba(20,19,18,.25);margin:40px auto 30px;transform:rotate(-.6deg);max-width:560px;position:relative}
.paper p{font-family:var(--serif);font-size:21px;line-height:1.5;margin-bottom:14px;font-weight:300}
.paper .sig{font-size:54px;color:var(--natt);text-align:left}
.paper .order{position:absolute;top:18px;right:20px;font-size:11px;letter-spacing:.14em;color:var(--sten)}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;text-align:left;margin:40px 0}
.timeline div{border-top:1px solid var(--natt);padding-top:12px;font-size:13px;color:#4b463f}
.timeline b{display:block;font-family:var(--serif);font-size:20px;font-weight:400;color:var(--natt)}
@media (max-width:640px){.timeline{grid-template-columns:1fr 1fr}}
.about-hero{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;padding:50px 0 90px}
.about-hero .portrait{aspect-ratio:3/4}
.promises{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.promises div{background:#efe9df;border-radius:var(--r);padding:30px}
.promises .n{font-family:var(--serif);font-size:56px;font-weight:300;line-height:1}
.promises h3{margin:14px 0 8px;font-size:24px}
.promises p{font-size:14px;color:#4b463f}
@media (max-width:820px){.about-hero,.promises{grid-template-columns:1fr;gap:28px}}
.faq{max-width:760px;margin:0 auto;padding:40px 22px 100px}

/* toast + mock pill */
.toast{position:fixed;left:50%;bottom:28px;z-index:90;transform:translate(-50%,30px);opacity:0;background:var(--natt);color:var(--linne);padding:14px 20px;border-radius:999px;font-size:13px;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mock-pill{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rok);border-radius:999px;padding:7px 8px 7px 14px;font-size:12px;box-shadow:0 10px 30px -12px rgba(0,0,0,.25)}
.mock-pill a{background:var(--natt);color:var(--linne);border-radius:99px;padding:6px 12px}
.mock-pill button{color:var(--sten);padding:0 4px}
@media (max-width:900px){.mock-pill{left:auto;right:12px;bottom:12px;padding:4px;font-size:11px}.mock-pill .lbl{display:none}}
.fade-in{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<body>

<div id="chrome"></div>
<main id="app"></main>
<div id="foot"></div>

<div class="scrim" id="scrim" data-act="close-cart"></div>
<aside class="drawer" id="drawer" aria-label="Cart"></aside>
<div class="mobile-menu" id="mmenu">
  <button class="close" data-act="close-menu">CLOSE ✕</button>
  <nav>
    <a href="#/" data-act="close-menu">Home</a>
    <a href="#/shop" data-act="close-menu">Shop</a>
    <a href="#/emilia" data-act="close-menu">Meet Emilia</a>
    <a href="#/faq" data-act="close-menu">Help</a>
  </nav>
  <p class="muted" style="margin-top:auto;font-size:13px">@emiliaglimt on Instagram &amp; TikTok</p>
</div>
<div class="toast" id="toast"></div>
<div class="mock-pill" id="mockpill"><span class="lbl">Design mockup</span> <a href="playbook.html">Brand playbook →</a><button data-act="hide-pill" aria-label="Hide">✕</button></div>

<script>
/* ---------- data ---------- */
const PRODUCTS = [
  {id:'natt-vin', name:'NATT Vin', type:'Wine glass', shape:'wine', price:38, left:14, of:40,
   size:'H 21 cm · Ø 9 cm · 450 ml', seed:7,
   blurb:'A generous wine glass with a black edge and a band of hand-laid gold leaf. Made for long dinners and red wine that someone opened "just to try".'},
  {id:'natt-skal', name:'NATT Skål', type:'Champagne flute', shape:'flute', price:38, left:9, of:40,
   size:'H 23 cm · Ø 7 cm · 210 ml', seed:21,
   blurb:'A slim flute that makes the bubbles look like they are rising through gold. Skål is what we say in Sweden when we raise a glass.'},
  {id:'natt-tva', name:'NATT för två', type:'Two flutes, gift-boxed', shape:'flute', pair:true, price:72, was:76, left:6, of:20,
   size:'2 × H 23 cm · 210 ml', seed:33,
   blurb:'Two flutes in one black box, for two people who deserve a toast. Each one painted on the same afternoon, so they are sisters, not twins.'},
  {id:'natt-bord', name:'NATT Bord', type:'Table set · 2 wine + 2 flutes', shape:'set', price:139, was:152, left:4, of:12,
   size:'2 wine glasses + 2 flutes', seed:51,
   blurb:'The whole table. Two wine glasses and two flutes, wrapped together. The set I would want for my own first apartment.'}
];
const FINISH = {
  klar:{label:'Clear stem', add:0, dot:'linear-gradient(135deg,#fff,#dfe3e2)'},
  guld:{label:'Gold stem', add:4, dot:'linear-gradient(115deg,#7A5A1C,#C9A24A 30%,#F4E3A3 50%,#B8913A 70%,#8C6A23)'}
};
const COUNTRIES = [
  ['SE','Sweden','se'],['DK','Denmark','nord'],['FI','Finland','nord'],['NO','Norway','out'],
  ['DE','Germany','eu'],['NL','Netherlands','eu'],['BE','Belgium','eu'],['FR','France','eu'],['AT','Austria','eu'],
  ['IT','Italy','eu'],['ES','Spain','eu'],['PT','Portugal','eu'],['IE','Ireland','eu'],['PL','Poland','eu'],
  ['CZ','Czechia','eu'],['EE','Estonia','eu'],['LV','Latvia','eu'],['LT','Lithuania','eu'],['LU','Luxembourg','eu'],
  ['GR','Greece','eu'],['HR','Croatia','eu'],['SI','Slovenia','eu'],['SK','Slovakia','eu'],['HU','Hungary','eu'],
  ['RO','Romania','eu'],['BG','Bulgaria','eu'],['CY','Cyprus','eu'],['MT','Malta','eu'],
  ['GB','United Kingdom','out'],['CH','Switzerland','out'],['IS','Iceland','out']
];
const ZONES = {
  se:{std:5,eta:'1–3 working days',free:true},
  nord:{std:9,eta:'2–4 working days',free:true},
  eu:{std:12,eta:'3–7 working days',free:true},
  out:{std:18,eta:'4–9 working days',free:false,note:'Outside the EU: import VAT/duties may apply on delivery.'}
};
const FREE_OVER = 100, SEK = 11;

/* ---------- state ---------- */
const S = {
  cart: JSON.parse(localStorage.getItem('eg_cart') || '[]'),
  cur: localStorage.getItem('eg_cur') || 'EUR',
  pdp: {finish:'klar', qty:1, view:0}
};
const save = () => { localStorage.setItem('eg_cart', JSON.stringify(S.cart)); localStorage.setItem('eg_cur', S.cur); };
const P = id => PRODUCTS.find(p => p.id === id);
const money = eur => S.cur === 'EUR'
  ? '€' + (Number.isInteger(eur) ? eur : eur.toFixed(2))
  : Math.round(eur * SEK).toLocaleString('sv-SE') + ' kr';
const unit = l => P(l.id).price + FINISH[l.finish].add;
const subtotal = () => S.cart.reduce((s, l) => s + unit(l) * l.qty, 0);
const count = () => S.cart.reduce((s, l) => s + l.qty, 0);

/* ---------- art: hand-painted glass, drawn in SVG ---------- */
let uid = 0;
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function flake(r, x, y, size){
  const n = 3 + Math.floor(r() * 3), a0 = r() * 6.28, pts = [];
  for (let i = 0; i < n; i++){ const a = a0 + i * 6.28 / n + (r() - .5) * .9, d = size * (.5 + r() * .7); pts.push((x + Math.cos(a) * d).toFixed(1) + ',' + (y + Math.sin(a) * d).toFixed(1)); }
  return pts.join(' ');
}
function glass({shape='wine', finish='klar', seed=1, dark=false} = {}){
  const id = 'g' + (++uid), r = rng(seed);
  const G = shape === 'wine'
    ? {bowl:'M48,22 C40,96 50,152 100,177 C150,152 160,96 152,22 Z', L:48, R:152, top:22, bot:177, gA:80, gB:124, bk:150, foot:52}
    : {bowl:'M73,22 C69,112 77,176 100,197 C123,176 131,112 127,22 Z', L:73, R:127, top:22, bot:197, gA:94, gB:142, bk:172, foot:42};
  const ink = dark ? 'rgba(255,248,235,.42)' : 'rgba(20,19,18,.30)';
  let fl = '';
  for (let i = 0; i < 26; i++){ const x = G.L - 6 + r() * (G.R - G.L + 12); fl += `<polygon points="${flake(r, x, G.gA + (r() - .65) * 12, 2 + r() * 4.5)}"/>`; }
  for (let i = 0; i < 26; i++){ const x = G.L - 6 + r() * (G.R - G.L + 12); fl += `<polygon points="${flake(r, x, G.gB + (r() - .35) * 12, 2 + r() * 4.5)}"/>`; }
  for (let i = 0; i < 14; i++){ const x = G.L + r() * (G.R - G.L), y = G.top + 22 + r() * (G.bk - G.top - 30); fl += `<polygon points="${flake(r, x, y, .8 + r() * 1.8)}"/>`; }
  let crack = '';
  for (let i = 0; i < 9; i++){ const x = G.L + r() * (G.R - G.L), y = G.gA + 4 + r() * (G.gB - G.gA - 8); crack += `<path d="M${x.toFixed(1)},${y.toFixed(1)} l${(r()*14-7).toFixed(1)},${(r()*6-3).toFixed(1)} l${(r()*12-6).toFixed(1)},${(r()*6-3).toFixed(1)}"/>`; }
  const stemFill = finish === 'guld' ? `url(#${id}gold)` : `url(#${id}stem)`;
  return `<svg viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="${id}gold" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#7A5A1C"/><stop offset=".28" stop-color="#C9A24A"/><stop offset=".48" stop-color="#F4E3A3"/><stop offset=".68" stop-color="#B8913A"/><stop offset="1" stop-color="#8C6A23"/></linearGradient>
    <linearGradient id="${id}glass" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="${dark?.10:.75}"/><stop offset=".45" stop-color="#e9e4da" stop-opacity="${dark?.04:.25}"/><stop offset="1" stop-color="#fff" stop-opacity="${dark?.12:.8}"/></linearGradient>
    <linearGradient id="${id}stem" x1="0" x2="1"><stop offset="0" stop-color="${dark?'#fff':'#cfc9be'}" stop-opacity=".5"/><stop offset=".5" stop-color="#fff" stop-opacity="${dark?.15:.9}"/><stop offset="1" stop-color="${dark?'#fff':'#bdb6aa'}" stop-opacity=".45"/></linearGradient>
    <radialGradient id="${id}sh"><stop offset="0" stop-color="#000" stop-opacity="${dark?.5:.16}"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="${id}clip"><path d="${G.bowl}"/></clipPath>
  </defs>
  <ellipse cx="100" cy="331" rx="${G.foot + 18}" ry="7" fill="url(#${id}sh)"/>
  <path d="${G.bowl}" fill="url(#${id}glass)"/>
  <g clip-path="url(#${id}clip)">
    <rect x="0" y="${G.top + 7}" width="200" height="11" fill="#141312"/>
    <rect x="0" y="${G.bk}" width="200" height="60" fill="#141312"/>
    <rect x="0" y="${G.gA}" width="200" height="${G.gB - G.gA}" fill="url(#${id}gold)"/>
    <g fill="url(#${id}gold)">${fl}</g>
    <g stroke="#6d5118" stroke-opacity=".35" stroke-width=".6" fill="none">${crack}</g>
    <path d="M${G.L + 13},${G.top + 26} C${G.L + 8},${G.top + 80} ${G.L + 14},${G.bk - 24} ${G.L + 30},${G.bk - 4}" stroke="#fff" stroke-opacity=".75" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M${G.R - 10},${G.top + 40} C${G.R - 7},${G.top + 70} ${G.R - 9},${G.top + 92} ${G.R - 16},${G.top + 110}" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <path d="${G.bowl}" fill="none" stroke="${ink}" stroke-width="1.2"/>
  <ellipse cx="100" cy="${G.top}" rx="${(G.R - G.L) / 2}" ry="3.2" fill="none" stroke="${ink}" stroke-width="1"/>
  <path d="M96.6,${G.bot - 3} C97.5,${G.bot + 10} 97.6,${G.bot + 40} 97.6,320 L102.4,320 C102.4,${G.bot + 40} 102.5,${G.bot + 10} 103.4,${G.bot - 3} Z" fill="${stemFill}" stroke="${ink}" stroke-width=".8"/>
  <ellipse cx="100" cy="322" rx="${G.foot}" ry="7" fill="${stemFill}" stroke="${ink}" stroke-width="1"/>
</svg>`;
}
function art(p, {finish='klar', dark=false} = {}){
  if (p.pair) return `<div class="duo">${glass({shape:'flute', finish, seed:p.seed, dark})}${glass({shape:'flute', finish, seed:p.seed + 1, dark})}</div>`;
  if (p.shape === 'set') return `<div class="duo">${glass({shape:'wine', finish, seed:p.seed, dark})}${glass({shape:'flute', finish, seed:p.seed + 1, dark})}${glass({shape:'flute', finish, seed:p.seed + 2, dark})}${glass({shape:'wine', finish, seed:p.seed + 3, dark})}</div>`;
  return glass({shape:p.shape, finish, seed:p.seed, dark});
}
function zoomArt(){
  const r = rng(99); let fl = '';
  for (let i = 0; i < 140; i++){ const x = r() * 400, edge = r() < .5 ? 140 : 262, y = edge + (r() - .5) * 46; fl += `<polygon points="${flake(r, x, y, 3 + r() * 13)}"/>`; }
  for (let i = 0; i < 40; i++) fl += `<polygon points="${flake(r, r() * 400, 40 + r() * 320, 1 + r() * 3)}"/>`;
  let crack = ''; for (let i = 0; i < 40; i++){ const x = r() * 400, y = 150 + r() * 100; crack += `<path d="M${x},${y} l${r()*40-20},${r()*14-7} l${r()*30-15},${r()*14-7}"/>`; }
  return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="zg" x1="0" y1="0" x2="1" y2=".4"><stop offset="0" stop-color="#7A5A1C"/><stop offset=".3" stop-color="#C9A24A"/><stop offset=".5" stop-color="#F4E3A3"/><stop offset=".7" stop-color="#B8913A"/><stop offset="1" stop-color="#8C6A23"/></linearGradient><linearGradient id="zs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <rect width="400" height="400" fill="#e9e5dc"/><rect y="0" width="400" height="36" fill="#141312"/><rect y="360" width="400" height="40" fill="#141312"/>
  <rect y="140" width="400" height="122" fill="url(#zg)"/><g fill="url(#zg)">${fl}</g><g stroke="#5e4512" stroke-opacity=".35" stroke-width="1" fill="none">${crack}</g>
  <rect x="70" y="0" width="40" height="400" fill="url(#zs)" transform="skewX(-8)"/></svg>`;
}
function flakeField(n, seed, area = {x:[0,100], y:[0,100]}){
  const r = rng(seed); let h = '';
  for (let i = 0; i < n; i++){
    const s = 4 + r() * 12, x = area.x[0] + r() * (area.x[1] - area.x[0]), y = area.y[0] + r() * (area.y[1] - area.y[0]);
    const cp = `polygon(${Math.round(r()*40)}% 0,100% ${Math.round(r()*50)}%,${Math.round(60+r()*40)}% 100%,0 ${Math.round(40+r()*60)}%)`;
    h += `<i style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;clip-path:${cp};--r0:${Math.round(r()*360)}deg;animation-delay:-${(r()*9).toFixed(1)}s"></i>`;
  }
  return `<div class="flake-field" aria-hidden="true">${h}</div>`;
}

function card(p){
  const low = p.left <= 6;
  return `<a class="card fade-in" href="#/p/${p.id}">

  </a>`;
}

    </div>

    <button class="btn btn-dark btn-block" type="submit" style="margin-top:30px;height:58px;font-size:15px" id="paybtn">Pay</button>
    <p class="demo">Mockup — no payment is taken. In the live shop this step is handled by Shopify/Stripe.</p>
    <p class="muted" style="font-size:12px;margin-top:20px;text-align:center"><a class="link" href="#/faq">Shipping</a> · <a class="link" href="#/faq">Returns (14 days)</a> · <a class="link" href="#/faq">Privacy</a></p>
  </div>
  <aside class="co-side"><div class="inner" id="sum"></div></aside>
</form>`;
};

pages.thanks = () => {
  const o = JSON.parse(sessionStorage.getItem('eg_last') || 'null');
  const first = o ? o.first : 'friend', no = o ? o.no : 'EG-1001', country = o ? o.countryName : 'you';
  return `
<div class="thanks fade-in">
  <div class="sig">Tack!</div>
  <h2>Your order is in my hands now.</h2>
  <div class="paper">
    <span class="order">ORDER ${no}</span>
    <p>Dear ${first},</p>
    <p>Thank you — really. Every order still makes me do a small dance in the kitchen. I'll wrap your order myself in the next couple of days and send it off to ${country}.</p>
    <p>When it arrives, raise a glass to something good.</p>
    <div class="sig">Emilia</div>
  </div>
  <div class="timeline">
    <div><b>Today</b>I get the notification (and the dance happens)</div>
    <div><b>1–3 days</b>Wrapped in black tissue, note handwritten</div>
    <div><b>On its way</b>Tracking link to your email</div>
    <div><b>Then</b>Skål! 🥂</div>
  </div>
  <p class="lead" style="margin:0 auto 26px">Post your table and tag <b>@emiliaglimt</b> — I repost every single one, and you'll be first to hear about drop 02.</p>
  <a class="btn btn-dark" href="#/">Back to the studio</a>
</div>`;
};

/* ---------- cart drawer + summaries ---------- */
function lineArt(l){ return art(P(l.id), {finish:l.finish}); }
function drawer(){
  const sub = subtotal(), need = Math.max(0, FREE_OVER - sub), pct = Math.min(100, sub / FREE_OVER * 100);
  document.getElementById('drawer').innerHTML = `
  <header><h3>Your cart</h3><button data-act="close-cart" style="font-size:12px;letter-spacing:.1em">CLOSE ✕</button></header>
  ${S.cart.length ? `
  <div class="ship-meter">${need ? `You're <b>${money(need)}</b> away from free EU shipping` : `<b>Free EU shipping</b> unlocked ✨`}<div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="items">${S.cart.map((l, i) => `
    <div class="line"><div class="th">${lineArt(l)}</div>
      <div><div class="nm">${P(l.id).name}</div><div class="vr">${P(l.id).type} · ${FINISH[l.finish].label}</div>
        <span class="mini-qty"><button data-act="lqty" data-i="${i}" data-d="-1">−</button>${l.qty}<button data-act="lqty" data-i="${i}" data-d="1">+</button></span><button class="rm" data-act="rm" data-i="${i}">Remove</button></div>
      <div class="pr">${money(unit(l) * l.qty)}</div></div>`).join('')}
  </div>
  <footer>
    <div class="tot"><span>Subtotal</span><span>${money(sub)}</span></div>
    <p class="hand">Every order comes with a handwritten note from me. — E.</p>
    <a class="btn btn-dark btn-block" href="#/checkout" data-act="close-cart">Checkout</a>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:10px">Klarna · Swish · Apple Pay · cards</p>
  </footer>` : `
  <div class="empty"><div class="sig">empty…</div><p class="muted" style="margin:10px 0 24px">Nothing to toast with yet.</p><a class="btn btn-dark" href="#/shop" data-act="close-cart">Shop NATT</a></div>`}`;
}
function shipCalc(){
  const c = document.getElementById('country')?.value || 'DE';
  const zone = ZONES[COUNTRIES.find(x => x[0] === c)[2]];
  const sel = document.querySelector('input[name=ship]:checked')?.value || 'std';
  const freeStd = zone.free && subtotal() >= FREE_OVER;
  const std = freeStd ? 0 : zone.std;
  const ship = sel === 'exp' ? zone.std + 10 : std;
  const wrap = document.getElementById('wrap')?.checked ? 3 : 0;
  return {c, zone, sel, std, ship, wrap, total: subtotal() + ship + wrap};
}
function summaryHTML(){
  const k = shipCalc();
  return `${S.cart.map(l => `<div class="sum-line"><div class="th">${lineArt(l)}<span class="q">${l.qty}</span></div><div><div style="font-weight:500;font-size:14px">${P(l.id).name}</div><div class="muted" style="font-size:12px">${FINISH[l.finish].label}</div></div><div style="font-size:14px">${money(unit(l) * l.qty)}</div></div>`).join('')}
  <div class="sum-row" style="margin-top:22px"><span>Subtotal</span><span>${money(subtotal())}</span></div>
  <div class="sum-row"><span>Shipping</span><span>${k.ship ? money(k.ship) : 'Free'}</span></div>
  ${k.wrap ? `<div class="sum-row"><span>Gift wrap</span><span>${money(k.wrap)}</span></div>` : ''}
  <div class="sum-row total"><span>Total</span><span><small>${S.cur}</small>${money(k.total)}</span></div>
  <p class="muted" style="font-size:12px">Including VAT</p>
  <div class="maker-note" style="margin-top:26px;border-bottom:0"><div class="av">E</div><p style="font-size:16px">“I'll pack this myself and write you a little note.”</p></div>`;
}
function refreshCheckout(){
  const k = shipCalc();
  document.getElementById('shipopts').innerHTML = `
    <label class="${k.sel === 'std' ? 'on' : ''}"><input type="radio" name="ship" value="std" ${k.sel === 'std' ? 'checked' : ''}><span class="grow">Standard, tracked<small>${k.zone.eta}</small></span><b>${k.std ? money(k.std) : 'Free'}</b></label>
    <label class="${k.sel === 'exp' ? 'on' : ''}"><input type="radio" name="ship" value="exp" ${k.sel === 'exp' ? 'checked' : ''}><span class="grow">Express<small>1–3 working days</small></span><b>${money(k.zone.std + 10)}</b></label>`;
  document.getElementById('shipnote').textContent = k.zone.note || (k.zone.free && !k.std ? '' : `Free standard shipping over ${money(FREE_OVER)}.`);
  document.getElementById('swishopt').style.display = k.c === 'SE' ? '' : 'none';
  if (k.c !== 'SE' && document.querySelector('input[name=pay]:checked').value === 'swish') document.querySelector('input[name=pay][value=card]').click();
  document.getElementById('sum').innerHTML = summaryHTML();
  document.getElementById('mobsum').innerHTML = summaryHTML();
  document.getElementById('mobtotal').textContent = money(k.total);
  document.getElementById('paybtn').textContent = 'Pay ' + money(k.total);
}

/* ---------- render + router ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, '').split('/');
  return {page: h[0] || 'home', arg: h[1]};
}
let lastRoute = '';
function render(){
  const {page, arg} = route();
  const key = page + '/' + (arg || '');
  if (key !== lastRoute){
    if (page === 'p') S.pdp = {finish:'klar', qty:1, view:0};
    lastRoute = key; window.scrollTo(0, 0);
    closeCart(); document.getElementById('mmenu').classList.remove('open');
  }
  const isCo = page === 'checkout';
  document.getElementById('chrome').style.display = isCo ? 'none' : '';
  document.getElementById('foot').style.display = isCo ? 'none' : '';
  chrome(); footer(); drawer();
  const fn = page === 'p' ? () => pages.product(arg) : (pages[page] || pages.home);
  document.getElementById('app').innerHTML = fn();
  if (isCo && S.cart.length) refreshCheckout();
  document.title = ({shop:'Shop', emilia:'Meet Emilia', faq:'Help', checkout:'Checkout', thanks:'Tack!'}[page] || (page === 'p' && P(arg) ? P(arg).name : 'Hand-painted glass')) + ' — Emilia Glimt';
}
function rerenderKeepScroll(){ const y = scrollY; render(); scrollTo(0, y); }
window.addEventListener('hashchange', render);
window.addEventListener('scroll', () => {
  document.getElementById('hdr')?.classList.toggle('scrolled', scrollY > 10);
  const add = document.getElementById('addbtn'), sb = document.getElementById('stickybuy');
  if (add && sb) sb.classList.toggle('show', add.getBoundingClientRect().bottom < 0);
}, {passive:true});

/* ---------- actions ---------- */
const toast = t => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); };
const openCart = () => { drawer(); document.getElementById('drawer').classList.add('open'); document.getElementById('scrim').classList.add('open'); };
const closeCart = () => { document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); };
function addToCart(id, finish, qty){
  const ex = S.cart.find(l => l.id === id && l.finish === finish);
  ex ? ex.qty += qty : S.cart.push({id, finish, qty});
  save(); chrome(); openCart();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'open-cart') openCart();
  else if (a === 'close-cart') closeCart();
  else if (a === 'open-menu') document.getElementById('mmenu').classList.add('open');
  else if (a === 'close-menu') document.getElementById('mmenu').classList.remove('open');
  else if (a === 'hide-pill') document.getElementById('mockpill').remove();
  else if (a === 'cur'){ S.cur = t.dataset.v; save(); rerenderKeepScroll(); }
  else if (a === 'quick-add'){ e.preventDefault(); addToCart(t.dataset.id, 'klar', 1); }
  else if (a === 'add') addToCart(t.dataset.id, S.pdp.finish, S.pdp.qty);
  else if (a === 'finish'){ S.pdp.finish = t.dataset.v; rerenderKeepScroll(); }
  else if (a === 'view'){ S.pdp.view = +t.dataset.i; rerenderKeepScroll(); }
  else if (a === 'pqty'){ S.pdp.qty = Math.max(1, Math.min(6, S.pdp.qty + +t.dataset.d)); rerenderKeepScroll(); }
  else if (a === 'lqty'){ const l = S.cart[+t.dataset.i]; l.qty += +t.dataset.d; if (l.qty < 1) S.cart.splice(+t.dataset.i, 1); save(); chrome(); drawer(); }
  else if (a === 'rm'){ S.cart.splice(+t.dataset.i, 1); save(); chrome(); drawer(); }
  else if (a === 'express') toast('Mockup: this opens Apple Pay / Google Pay / Klarna');
  else if (a === 'scroll-join'){ e.preventDefault(); location.hash = '#/'; setTimeout(() => document.getElementById('join')?.scrollIntoView(), 50); }
});
document.addEventListener('change', e => {
  if (!document.querySelector('[data-form=checkout]')) return;
  if (e.target.id === 'isgift') document.getElementById('giftbox').style.display = e.target.checked ? '' : 'none';
  if (e.target.name === 'pay'){
    document.querySelectorAll('#payopts label').forEach(l => l.classList.toggle('on', l.contains(e.target)));
    document.querySelectorAll('.pay-panel').forEach(p => p.style.display = p.dataset.panel === e.target.value ? '' : 'none');
  }
  if (['country', 'wrap'].includes(e.target.id) || e.target.name === 'ship') refreshCheckout();
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'join'){ f.innerHTML = '<p style="padding:14px 18px;width:100%;text-align:center">You\'re on the list ✨ — see you at the next drop.</p>'; return; }
  if (f.dataset.form === 'checkout'){
    let ok = true;
    f.querySelectorAll('[required]').forEach(i => { const bad = !i.value.trim() || (i.type === 'email' && !/^\S+@\S+\.\S+$/.test(i.value)); i.closest('.f').classList.toggle('err', bad); if (bad && ok){ ok = false; i.focus(); } });
    if (!ok){ toast('Just a few details missing'); return; }
    const k = shipCalc(), fd = new FormData(f);
    sessionStorage.setItem('eg_last', JSON.stringify({first: fd.get('first'), no: 'EG-' + (1000 + Math.floor(Math.random() * 900)), countryName: COUNTRIES.find(c => c[0] === k.c)[1], items: count()}));
    const btn = document.getElementById('paybtn'); btn.textContent = 'Processing…'; btn.disabled = true;
    setTimeout(() => { S.cart = []; save(); location.hash = '#/thanks'; }, 900);
  }
});
render();
</script>
</body>
</html>
